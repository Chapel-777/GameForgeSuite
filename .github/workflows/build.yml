name: Build GameForge Suite EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter psutil pywin32 GPUtil pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name "GameForgeSuite_v2" --clean gameforge_suite.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameForgeSuite_v2_EXE
        path: dist/GameForgeSuite_v2.exe
